<style>
/* Layout: slime-dripped header, glitch title, chrome-bezel specimen cards on a dark scanline lab floor. One committed dark look. */
:root {
  --bg: #040912;
  --panel: #091426;
  --panel-2: #0d1d36;
  --green: #39ff88;
  --lime: #b6ff3c;
  --blue: #2f7bff;
  --cyan: #38e8ff;
  --ink: #e8f6ff;
  --soft: #8fb0c9;
  --chrome: linear-gradient(135deg, #f4fbff 0%, #9bb2c9 22%, #eaf6ff 45%, #5d738c 70%, #cfe3f5 100%);
  --font-display: "Audiowide", "Arial Black", system-ui, sans-serif;
  --font-body: "Chakra Petch", system-ui, -apple-system, sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(60% 40% at 15% 0%, rgba(57,255,136,.16), transparent 70%),
    radial-gradient(60% 45% at 90% 20%, rgba(47,123,255,.22), transparent 70%),
    linear-gradient(rgba(56,232,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,232,255,.06) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
  overflow-x: hidden;
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 20; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }

/* slime drip band */
.drip { position: absolute; top: 0; left: 0; width: 100%; height: 96px; display: block; pointer-events: none; filter: drop-shadow(0 0 14px rgba(57,255,136,.55)); }
.drip-wrap { position: relative; height: 96px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.wrap { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 52px; }

header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
.flask { width: 116px; height: 136px; position: relative; margin-top: -26px; }
.flask svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 16px rgba(57,255,136,.5)); }
.bubble { position: absolute; border-radius: 50%; border: 2px solid #eaffe9; background: rgba(57,255,136,.35); animation: rise 3.4s ease-in infinite; }
.bubble.b1 { width: 12px; height: 12px; left: 40px; top: 22px; }
.bubble.b2 { width: 8px; height: 8px; left: 64px; top: 26px; animation-delay: 1.1s; }
.bubble.b3 { width: 10px; height: 10px; left: 52px; top: 18px; animation-delay: 2.2s; }
@keyframes rise { 0% { transform: translateY(46px) scale(.6); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-30px) scale(1.1); opacity: 0; } }

.tag { font-family: var(--font-mono); font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); }
.tag::before { content: "// "; color: var(--green); }

h1 { position: relative; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 9.5vw, 4.8rem); line-height: 1.02; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance;
  background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 18px rgba(47,123,255,.55)); }
h1::before, h1::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0; -webkit-text-fill-color: currentColor; background: none; }
h1::before { color: var(--green); }
h1::after { color: var(--blue); }
h1.glitch::before { opacity: .95; animation: g1 .45s steps(2, end) 1; }
h1.glitch::after { opacity: .95; animation: g2 .45s steps(2, end) 1; }
@keyframes g1 { 0% { transform: translate(-5px, 1px); clip-path: inset(10% 0 62% 0); } 25% { transform: translate(5px, -2px); clip-path: inset(55% 0 12% 0); } 50% { transform: translate(-3px, 2px); clip-path: inset(30% 0 40% 0); } 75% { transform: translate(6px, 0); clip-path: inset(72% 0 4% 0); } 100% { transform: translate(0); clip-path: inset(0 0 100% 0); } }
@keyframes g2 { 0% { transform: translate(5px, -1px); clip-path: inset(60% 0 14% 0); } 25% { transform: translate(-6px, 2px); clip-path: inset(8% 0 70% 0); } 50% { transform: translate(4px, -2px); clip-path: inset(44% 0 30% 0); } 75% { transform: translate(-5px, 0); clip-path: inset(18% 0 58% 0); } 100% { transform: translate(0); clip-path: inset(0 0 100% 0); } }

.lede { max-width: 46ch; margin: 0; font-size: 1.1rem; color: var(--soft); text-wrap: balance; }
.handles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.handle { font-family: var(--font-mono); font-size: .95rem; padding: 7px 16px; border-radius: 999px; color: #03120a; background: linear-gradient(180deg, #eaffe9 0%, var(--green) 45%, #12b85a 100%); box-shadow: 0 0 18px rgba(57,255,136,.5), inset 0 1px 0 rgba(255,255,255,.8); }
.handle.alt { background: linear-gradient(180deg, #e8f6ff 0%, var(--cyan) 40%, var(--blue) 100%); box-shadow: 0 0 18px rgba(47,123,255,.6), inset 0 1px 0 rgba(255,255,255,.8); color: #02101f; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 20px; display: flex; align-items: center; gap: 14px; color: var(--ink); }
h2::before { content: ""; width: 14px; height: 14px; border-radius: 50% 50% 50% 0; background: var(--green); box-shadow: 0 0 12px var(--green); transform: rotate(-45deg); flex: none; }
h2::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--blue), transparent); }

/* chrome-bezel cards */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 24px; }
.card { display: block; text-decoration: none; color: var(--ink); padding: 3px; border-radius: 22px; background: var(--chrome); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.55), 0 0 26px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform .15s ease, box-shadow .15s ease; min-width: 0; }
.card .in { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px; border-radius: 19px; background: linear-gradient(160deg, var(--panel-2) 0%, var(--panel) 60%, #060d1a 100%); position: relative; overflow: hidden; }
.card .in::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; background: linear-gradient(180deg, rgba(255,255,255,.09), transparent); pointer-events: none; }
.card .in::after { content: ""; position: absolute; left: 24px; top: 0; width: 18px; height: 22px; border-radius: 0 0 50% 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
a.card:hover, a.card:focus-visible { transform: translateY(-4px); box-shadow: 0 0 0 1px rgba(255,255,255,.15), 0 16px 36px rgba(0,0,0,.6), 0 0 40px var(--accent); }
a.card:hover h3 { animation: jit .3s steps(2, end) 2; }
@keyframes jit { 0% { text-shadow: -3px 0 var(--green), 3px 0 var(--blue); transform: translateX(-2px); } 50% { text-shadow: 3px 0 var(--green), -3px 0 var(--blue); transform: translateX(2px); } 100% { text-shadow: none; transform: none; } }

.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.shots img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: #060d1a; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 4px 14px rgba(0,0,0,.45); }
.card.has-shots .vial { display: none; }
a.card:focus-visible, .link:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }
.vial { width: 50px; height: 50px; margin-top: 12px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 35%, #02060d)); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 0 16px color-mix(in srgb, var(--accent) 60%, transparent); }
.vial svg { width: 28px; height: 28px; stroke: #03121a; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; line-height: 1.2; margin: 4px 0 0; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--soft); font-size: .97rem; }
.meta { margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.status { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: #03121a; background: var(--accent); border-radius: 999px; padding: 3px 11px; box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent); }
.go { font-family: var(--font-mono); font-size: .88rem; color: var(--accent); }
.card.soon .go { color: var(--soft); }

.links { display: flex; flex-wrap: wrap; gap: 14px; }
.link { display: inline-flex; align-items: baseline; gap: 10px; text-decoration: none; font-family: var(--font-display); font-size: 1rem; text-transform: uppercase; letter-spacing: .04em; color: #03121a; padding: 11px 20px; border-radius: 14px; background: linear-gradient(180deg, #f4fbff 0%, var(--accent) 38%, color-mix(in srgb, var(--accent) 55%, #03121a) 100%); box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.85); transition: transform .15s ease, box-shadow .15s ease; }
.link small { font-family: var(--font-mono); font-size: .8rem; text-transform: none; letter-spacing: 0; opacity: .8; }
.link:hover { transform: translateY(-3px); box-shadow: 0 0 34px var(--accent), inset 0 1px 0 rgba(255,255,255,.85); }

footer { text-align: center; font-family: var(--font-mono); font-size: .85rem; color: var(--soft); }
footer b { color: var(--green); font-weight: 400; }

@media (prefers-reduced-motion: reduce) {
  .bubble { animation: none; opacity: 1; }
  h1.glitch::before, h1.glitch::after { animation: none; opacity: 0; }
  a.card:hover h3 { animation: none; }
  .card, .link { transition: none; }
}
</style>

<div class="drip-wrap" aria-hidden="true">

    <path fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round" d="M20 22C60 24 90 20 112 22M300 22C360 24 400 20 440 22M780 20C830 22 870 20 920 22"/>

<div class="wrap">
  <header>
    <div class="flask" aria-hidden="true">
      <svg viewBox="0 0 112 132">
        <defs>
          <linearGradient id="goo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6ff3c"/><stop offset="1" stop-color="#0fbf62"/></linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f6ff" stop-opacity=".35"/><stop offset="1" stop-color="#2f7bff" stop-opacity=".18"/></linearGradient>
        </defs>
        <path d="M42 6h28v34l30 62a14 14 0 0 1-12.600 20H24.600A14 14 0 0 1 12 102l30-62z" fill="url(#glass)" stroke="#d8ecff" stroke-width="4" stroke-linejoin="round"/>
        <path d="M22 88q17-8 34 0t34 0l10 14a10 10 0 0 1-9 14H21a10 10 0 0 1-9-14z" fill="url(#goo)" stroke="#d8ecff" stroke-width="4" stroke-linejoin="round"/>
        <path d="M36 6h40" stroke="#eaf6ff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="46" cy="104" r="3.500" fill="#03121a"/><circle cx="66" cy="104" r="3.500" fill="#03121a"/>
        <path d="M49 112q7 6 14 0" stroke="#03121a" stroke-width="3.500" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
    </div>
    <div class="tag">vibecoded in small batches</div>
    <h1 id="title" data-text="YG's Laboratory">YG's Laboratory</h1>
    <p class="lede">Games, worlds and weird little sites mixed together with AI. Poke around, click a flask, see what oozes out.</p>
    <div class="handles">
      <span class="handle">@YGMackillaVR</span>
      <span class="handle alt">@YGFabrications</span>
    </div>
  </header>

  <main style="display:flex;flex-direction:column;gap:52px">
    <section aria-labelledby="exp">
      <h2 id="exp">On the bench</h2>
      <div class="grid" id="projects"></div>
    </section>

    <section aria-labelledby="find">
      <h2 id="find">Find me</h2>
      <div class="links" id="links"></div>
    </section>
  </main>

  <footer>Handle with care. May contain slime, kitties and bass. <b>&middot; YG's Laboratory</b></footer>
</div>

<script>
/* Edit this list to change the page. Leave url empty for a "link coming soon" card. */
var PROJECTS = [
  { images: ["img/hexcat-1.webp", "img/hexcat-2.webp"], alt: "Hexcat Hollow", name: "Hexcat Hollow", color: "green", status: "Playable",
    blurb: "A Halloween kitty-wizard arena battler in 3D, with bots and multiplayer. Runs right in your browser.",
    url: "https://ygmackilla.github.io/hexcat-hollow/", cta: "Play it", icon: "wand" },
  { images: ["img/hexvr-1.webp", "img/hexvr-2.webp"], alt: "Hexcat Hollow VRChat world", name: "Hexcat Hollow VRChat", color: "lime", status: "VRChat world",
    blurb: "The kitty-wizard arena battler as a VRChat world. Jump in with friends and cast spells.",
    url: "https://vrchat.com/home/world/wrld_937a15b3-6b8e-4128-ae43-d50c1ad9bd01", cta: "Open in VRChat", icon: "wand" },
  { images: ["img/zombie-1.webp", "img/zombie-2.webp"], alt: "Zombie DJ School", name: "Zombie DJ School", color: "cyan", status: "Contest entry",
    blurb: "A cute DJ tutorial app taught by kawaii cutout zombies. Built for the Builder Network challenge, Teach Me Something Scary.",
    url: "https://ygmackilla.github.io/zombie-dj-school/", cta: "Try it", icon: "disc" },
  { images: ["img/crew-1.webp", "img/crew-2.webp"], alt: "Electric Crew", name: "Electric Crew LGBTQ", color: "blue", status: "Live",
    blurb: "Home of the 18+ LGBTQIA+ and allies VR community on VRChat and Meta Horizon Worlds, with a DJ set-slot booking system.",
    url: "https://ygmackilla.github.io/electric-crew-website/", cta: "Visit site", icon: "spark" },
  { images: ["img/lounge-1.webp", "img/lounge-2.webp"], alt: "Celestial Lounge", name: "Celestial Lounge", color: "cyan", status: "VRChat world",
    blurb: "A dreamy cosmic lounge in VRChat, home of Electric Crew nights and DJ sets.",
    url: "https://vrchat.com/home/world/wrld_fb64a2f5-606a-49a4-87be-a871bd231cd2", cta: "Open in VRChat", icon: "disc" },
  { images: ["img/fab-1.webp", "img/fab-2.webp"], alt: "YG Fabrications", name: "YG Fabrications", color: "green", status: "Fashion",
    blurb: "My fashion work for Meta Horizon Worlds. Take a look at what I've made.",
    url: "https://ygfabrications.lovable.app/", cta: "See the work", icon: "spark" },
  { images: ["img/rw-1.webp", "img/rw-2.webp"], alt: "YG-Robotics Warehouse", name: "YG-ROBOTICS WAREHOUSE // MACKILLA", color: "lime", status: "VRChat world",
    blurb: "A luxury robotics factory turned rave venue. Six glowing robot statues, audio-reactive cables and a liquid-chrome sculpture. PC and Quest.",
    url: "", cta: "Search it in VRChat", icon: "bolt" }
];
var LINKS = [
  { label: "Instagram", sub: "@YGFabrications", url: "https://instagram.com/ygfabrications", color: "green" },
  { label: "Instagram", sub: "@YGMackillaVR", url: "https://instagram.com/ygmackillavr", color: "cyan" },
  { label: "Instagram", sub: "@ElectricCrewLGBTQ", url: "https://instagram.com/electriccrewlgbtq", color: "lime" },
  { label: "Fashion", sub: "YG Fabrications", url: "https://ygfabrications.lovable.app/", color: "lime" },
  { label: "VRChat", sub: "Hexcat Hollow", url: "https://vrchat.com/home/world/wrld_937a15b3-6b8e-4128-ae43-d50c1ad9bd01", color: "green" },
  { label: "VRChat", sub: "Celestial Lounge", url: "https://vrchat.com/home/world/wrld_fb64a2f5-606a-49a4-87be-a871bd231cd2", color: "blue" },
  { label: "Twitch", sub: "YGMackillaVR", url: "https://www.twitch.tv/ygmackillavr", color: "blue" },
  { label: "GitHub", sub: "YGMackilla", url: "https://github.com/YGMackilla", color: "cyan" },
  { label: "Electric Crew", sub: "Discord", url: "https://discord.gg/uubT9dKxT", color: "green" }
];
var ICONS = {
  wand: '<path d="M5 21 17 9"/><path d="m15 5 4 4"/><path d="M19 2v3M17.500 3.500h3M6 4v3M4.500 5.500h3"/>',
  disc: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.500"/><path d="M12 3a9 9 0 0 1 9 9"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.500 2.500M15.500 15.500 18 18M18 6l-2.500 2.500M8.500 15.500 6 18"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'
};
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
document.getElementById("projects").innerHTML = PROJECTS.map(function(p){
  var inner =
    '<div class="in"><div class="vial"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[p.icon] + '</svg></div>' +
    (p.images ? '<div class="shots">' + p.images.map(function(src, i){ return '<img src="' + esc(src) + '" alt="' + esc(p.alt + ' screenshot ' + (i + 1)) + '" loading="lazy" width="800" height="600">'; }).join("") + '</div>' : '') +
    '<h3>' + esc(p.name) + '</h3><p>' + esc(p.blurb) + '</p>' +
    '<div class="meta"><span class="status">' + esc(p.status) + '</span><span class="go">' + esc(p.cta) + (p.url ? ' &rarr;' : '') + '</span></div></div>';
  var style = ' style="--accent: var(--' + p.color + ')"';
  var extra = p.images ? ' has-shots' : '';
  return p.url
    ? '<a class="card' + extra + '"' + style + ' href="' + esc(p.url) + '" target="_blank" rel="noopener">' + inner + '</a>'
    : '<div class="card soon' + extra + '"' + style + '>' + inner + '</div>';
}).join("");
document.getElementById("links").innerHTML = LINKS.map(function(l){
  return '<a class="link" style="--accent: var(--' + l.color + ')" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + ' <small>' + esc(l.sub) + '</small></a>';
}).join("");
/* title glitch burst every few seconds */
(function(){
  var h = document.getElementById("title");
  function burst(){ h.classList.remove("glitch"); void h.offsetWidth; h.classList.add("glitch"); }
  setTimeout(burst, 600);
  setInterval(burst, 4200);
})();
</script>
